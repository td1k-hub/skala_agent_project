[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-guard-backend"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.26,<2", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "anyio>=4.8,<5", "langgraph>=1.2.15,<2", "langchain-core>=1.6.10,<2", "langsmith>=0.14.8,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["pump_guard*"]

[tool.setuptools.package-data]
pump_guard = ["references.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
